{% extends 'base.html' %}

{% block content %}

<div class = "hero">
    <h2>Track Your Nutrition</h2>
    <p>Search food</p>
</div>

<div class="search-container">
    <form action = "{{ url_for('search')}}" method = "POST">
        <input
            type = "text"
            name = "food_name"
            placeholder = "search a food... (e.g. chicken breast,apple,rice)"
            required>
        <input 
            type = "number"
            name = "grams"
            placeholder="Grams (default 100g)" min="1">
        <button type="submit">Search</button>

    </form>
</div>

{% endblock %}
